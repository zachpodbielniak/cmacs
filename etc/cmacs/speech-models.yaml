# speech-models.yaml --- the curated speech model catalog (seed)
#
# Copyright (C) 2026 Zach Podbielniak
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The models M-x cmacs-speech offers to download.  This file is the
# hand-edited source; admin/cmacs-speech-catalog.sh resolves every entry
# to a URL, checks it exists, adds its size and SHA-256 (GitHub release
# digests, Hugging Face's x-linked-etag) and writes speech-models.eld,
# which is what Emacs reads (it has no YAML reader).  Regenerate after
# editing:  admin/cmacs-speech-catalog.sh
#
# Fields:
#   id          install name (a directory for sherpa, a file otherwise)
#   backend     whisper | sherpa | piper
#   components  which cmacs-speech components it serves
#   source      sherpa: "<release-tag>/<asset>"; whisper / piper: a
#               Hugging Face "<repo>/<path>" (piper: the .onnx; its
#               .onnx.json comes along)
#   languages   ISO codes, "multi" for many
#   quality / speed   1-5 stars, a rough guide for the settings buffer
#   sample      a listenable sample for TTS voices (optional)
#   description one line

models:
  # ---------------------------------------------------------------- VAD
  - id: silero_vad
    backend: sherpa
    components: [vad]
    source: asr-models/silero_vad.onnx
    languages: [multi]
    quality: 4
    speed: 5
    description: "Silero VAD v5: the standard voice activity detector, 2 MB."
  - id: ten-vad
    backend: sherpa
    components: [vad]
    source: asr-models/ten-vad.onnx
    languages: [multi]
    quality: 5
    speed: 5
    description: "TEN-VAD: lower latency and fewer false starts than Silero."
  - id: ggml-silero-v6.2.0.bin
    backend: whisper
    components: [vad]
    source: ggml-org/whisper-vad/ggml-silero-v6.2.0.bin
    languages: [multi]
    quality: 4
    speed: 5
    description: "Silero VAD for whisper.cpp (what the voice loop used before)."

